# Learning-path Telegram bot
# v4: one job instead of three; times are Lisbon all year (each message has a summer and a
#     winter cron entry, and bot.py skips the one that doesn't apply). Supabase removed.

name: Telegram Daily Bot

on:
  schedule:
    # 06:30 Lisbon — commute reminder + question of the day (summer, winter)
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    # 20:00 Lisbon — daily log nudge
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    # 18:00 Lisbon on Sundays — weekly check-in
    - cron: "0 17 * * 0"
    - cron: "0 18 * * 0"

  # Send one message type manually from the Actions tab
  workflow_dispatch:
    inputs:
      message_type:
        description: "Which message to send"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekly

jobs:
  send:
    name: Send message
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE:           ${{ github.event.schedule }}
          MESSAGE_TYPE:       ${{ github.event.inputs.message_type }}
        run: python bot.py
